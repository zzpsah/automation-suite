name: Windows Work Browser - Contract Gate

on:
  push:
    paths:
      - 'browser-automation/windows-work-browser/**'
      - '.github/workflows/windows-work-browser-contract.yml'
  pull_request:
    paths:
      - 'browser-automation/windows-work-browser/**'
      - '.github/workflows/windows-work-browser-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate required contracts and release documents
        shell: bash
        run: |
          set -euo pipefail
          root='browser-automation/windows-work-browser'
          files=(
            README.md BUILD-STATUS.md
            docs/BUILD-PLAN.md docs/RELEASE-GATES.md docs/THIRD-PARTY-NOTICES.md docs/IMPLEMENTATION-MATRIX.md
            upstream/BROWSEROS-PIN.md upstream/REUSE-MATRIX.md upstream/BUILD-GATE.md upstream/OPTION-A-RELEASE.json
            agent/action-contract.ts agent/policy-engine.ts agent/evidence-schema.ts
            agent/executor-contract.ts agent/verification-contract.ts
            agent/task-contract.ts agent/task-runner.ts
            agent/native-executor-contract.ts agent/mcp-gateway-contract.ts
            agent/extraction-contract.ts agent/permission-contract.ts
            agent/credential-vault-contract.ts agent/update-contract.ts
            runtime/browser-control.ts runtime/desktop-control.ts runtime/capability-services.ts runtime/workspace-contract.ts runtime/extraction-planner.ts
          )
          for f in "${files[@]}"; do test -f "$root/$f" || { echo "Missing $root/$f"; exit 1; }; done

      - name: Reject arbitrary native execution from agent layer
        shell: bash
        run: |
          set -euo pipefail
          root='browser-automation/windows-work-browser/agent'
          if grep -RniE 'child_process|exec\(|execFile\(|spawn\(|powershell\s+-command|Invoke-Expression|cmd\.exe\s+/c' "$root"; then
            echo 'Potential direct arbitrary execution found in agent layer.'
            exit 1
          fi

      - name: Validate immutable upstream pins
        shell: bash
        run: |
          set -euo pipefail
          grep -q '8f5d36bc16f57115aeeff34baf4ad6aa964d509c' browser-automation/windows-work-browser/upstream/BROWSEROS-PIN.md
          grep -q '7765002ac88040aedc781be89afe68475a9d6c88' browser-automation/windows-work-browser/upstream/BROWSEROS-PIN.md
          grep -q 'v0.50.3' browser-automation/windows-work-browser/upstream/OPTION-A-RELEASE.json

      - name: Validate security invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'APPROVAL_REQUIRED_RISKS' browser-automation/windows-work-browser/agent/policy-engine.ts
          grep -q 'requiresExplicitApproval' browser-automation/windows-work-browser/agent/permission-contract.ts
          grep -q 'CredentialVault' browser-automation/windows-work-browser/agent/credential-vault-contract.ts
          grep -q 'assertSafeEvidence' browser-automation/windows-work-browser/agent/evidence-schema.ts
          grep -q 'requiresApproval' browser-automation/windows-work-browser/agent/action-contract.ts
