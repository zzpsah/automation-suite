name: Global Document Telegram Notifier

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: global-document-telegram-notifier
  cancel-in-progress: false

jobs:
  notify:
    name: Published document → Telegram output bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Send published document notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_OUTPUT_BOT_TOKEN: ${{ secrets.TELEGRAM_OUTPUT_BOT_TOKEN }}
          TELEGRAM_NOTIFICATION_CHAT_IDS: ${{ secrets.TELEGRAM_NOTIFICATION_CHAT_IDS }}
        run: python global-automation/scripts/document/telegram_publication_notifier.py
