name: Global Document Telegram Notifier

on:
  push:
    branches: [main]
    paths:
      - 'global-automation/scripts/document/telegram_delivery_progress.py'
      - 'global-automation/scripts/document/telegram_publication_notifier_v3.py'
      - 'global-automation/scripts/document/telegram_publication_notifier_targeted.py'
      - '.github/workflows/global-document-telegram-notifier.yml'
  workflow_dispatch:
    inputs:
      document_id:
        description: 'Optional document UUID to deliver exclusively'
        required: false
        type: string
  repository_dispatch:
    types: [document-publication-notify]
  workflow_run:
    workflows: ["Global Document Publication"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  # Keep unrelated document deliveries independent. A repository_dispatch is
  # keyed to its document, while scheduled/manual/workflow-run fallbacks use
  # their own bounded groups so a newly arrived document is not silently
  # cancelled behind another delivery.
  group: >-
    ${{
      github.event_name == 'repository_dispatch'
      && format('global-document-telegram-notifier-{0}', github.event.client_payload.document_id || github.run_id)
      || github.event_name == 'schedule'
      && 'global-document-telegram-notifier-schedule'
      || format('global-document-telegram-notifier-run-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  notify:
    name: Published document → eLettersBot validated delivery
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests boto3 pypdf Pillow pytest

      - name: Run file delivery regression tests
        env:
          PYTHONPATH: global-automation/scripts/document
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: test-only
          TELEGRAM_OUTPUT_BOT_TOKEN: test-only
        run: python -m pytest -q global-automation/scripts/document/test_*.py

      - name: Send published document notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_OUTPUT_BOT_TOKEN: ${{ secrets.TELEGRAM_OUTPUT_BOT_TOKEN }}
          TELEGRAM_OUTPUT_BOT_USERNAME: eLettersBot
          TELEGRAM_NOTIFICATION_CHAT_IDS: ${{ secrets.TELEGRAM_NOTIFICATION_CHAT_IDS }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          DOCUMENT_ID: ${{ github.event.client_payload.document_id || github.event.inputs.document_id }}
        run: |
          if [ -n "$DOCUMENT_ID" ]; then
            python global-automation/scripts/document/telegram_publication_notifier_targeted.py
          else
            python global-automation/scripts/document/telegram_publication_notifier_v3.py
          fi

      - name: Update existing Telegram progress message with delivery state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DOCUMENT_ID: ${{ github.event.client_payload.document_id || github.event.inputs.document_id }}
        run: python global-automation/scripts/document/telegram_delivery_progress.py
