name: Global Document Telegram Notifier

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Global Document Publication"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: global-document-telegram-notifier
  cancel-in-progress: false

jobs:
  notify:
    name: Published document → eLettersBot validated delivery
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install system conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests boto3 pypdf Pillow
      - name: Send published document notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_OUTPUT_BOT_TOKEN: ${{ secrets.TELEGRAM_OUTPUT_BOT_TOKEN }}
          TELEGRAM_OUTPUT_BOT_USERNAME: eLettersBot
          TELEGRAM_NOTIFICATION_CHAT_IDS: ${{ secrets.TELEGRAM_NOTIFICATION_CHAT_IDS }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: python global-automation/scripts/document/telegram_publication_notifier_v3.py
