name: eLettersBot Delivery Regression

on:
  push:
    paths:
      - 'global-automation/scripts/document/telegram_file_delivery.py'
      - 'global-automation/scripts/document/test_telegram_file_delivery.py'
      - '.github/workflows/elettersbot-regression.yml'
  workflow_dispatch:

concurrency:
  group: elettersbot-regression
  cancel-in-progress: true

jobs:
  regression:
    name: Validate PDF/image/office delivery preparation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install system conversion tools
        run: sudo apt-get update && sudo apt-get install -y libreoffice
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pypdf Pillow
      - name: Run delivery regression suite
        env:
          PYTHONPATH: global-automation/scripts/document
        run: python -m unittest discover -s global-automation/scripts/document -p 'test_telegram_file_delivery.py'
