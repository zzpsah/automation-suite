name: Windows Work Browser - Option A

on:
  push:
    paths:
      - 'browser-automation/windows-work-browser/**'
      - '.github/workflows/windows-work-browser-option-a.yml'
  pull_request:
    paths:
      - 'browser-automation/windows-work-browser/**'
      - '.github/workflows/windows-work-browser-option-a.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-work-browser-option-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-integrity-and-launch:
    name: Verify BrowserOS Windows artifact
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ARTIFACT_URL: https://github.com/browseros-ai/BrowserOS/releases/download/v0.50.3/BrowserOS_v0.50.3_x64_installer.exe
      EXPECTED_SHA256: 3ae8dc6cd7fa8c39760d8c95591147e283705ec7d6f1cc4b02561d2696ef86c7
      ARTIFACT_NAME: BrowserOS_v0.50.3_x64_installer.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'windows-work-browser'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $path = Join-Path $stage $env:ARTIFACT_NAME
          Invoke-WebRequest -Uri $env:ARTIFACT_URL -OutFile $path
          "ARTIFACT_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $env:ARTIFACT_PATH).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "SHA-256 mismatch. Expected $env:EXPECTED_SHA256 but got $actual"
          }
          "Verified SHA-256: $actual"

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature -FilePath $env:ARTIFACT_PATH
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode signature is not valid: $($sig.Status)"
          }
          "Signer: $($sig.SignerCertificate.Subject)"

      - name: Install BrowserOS with bounded Chromium installer invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proc = Start-Process -FilePath $env:ARTIFACT_PATH -ArgumentList '/silent', '/install', '--do-not-launch-chrome' -PassThru -WindowStyle Hidden
          $completed = $proc.WaitForExit(90000)
          if (-not $completed) {
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
            $installerLog = Join-Path $env:TEMP 'chromium_installer.log'
            if (Test-Path $installerLog) { Get-Content $installerLog -Tail 200 }
            throw 'BrowserOS installer did not exit within 90 seconds.'
          }
          if ($proc.ExitCode -ne 0) {
            $installerLog = Join-Path $env:TEMP 'chromium_installer.log'
            if (Test-Path $installerLog) { Get-Content $installerLog -Tail 200 }
            throw "BrowserOS installer exited with code $($proc.ExitCode)"
          }
          $installDir = Join-Path $env:LOCALAPPDATA 'BrowserOS\Application'
          "INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          if (-not (Test-Path $installDir)) { throw "Expected BrowserOS install directory was not found: $installDir" }

      - name: Launch and verify browser/CDP smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-work-browser-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $candidates = @(
            (Join-Path $env:INSTALL_DIR 'chrome.exe'),
            (Join-Path $env:INSTALL_DIR 'BrowserOS.exe')
          )
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) {
            Get-ChildItem -Path $env:INSTALL_DIR -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Set-Content (Join-Path $evidence 'installed-executables.txt')
            throw "Installed BrowserOS executable was not found under $env:INSTALL_DIR"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $browser).Hash.ToLowerInvariant()
          $profile = Join-Path $env:RUNNER_TEMP 'windows-work-browser-profile'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $port = 9222
          $proc = Start-Process -FilePath $browser -ArgumentList '--new-window', 'https://example.com', "--user-data-dir=$profile", "--remote-debugging-port=$port", '--no-first-run', '--no-default-browser-check' -PassThru
          try {
            $cdp = $null
            for ($i = 0; $i -lt 20 -and -not $cdp; $i++) {
              Start-Sleep -Seconds 1
              try { $cdp = Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/version" -TimeoutSec 2 } catch {}
            }
            if (-not $cdp) { throw 'Browser did not expose a CDP endpoint within 20 seconds.' }
            $tabs = Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/list" -TimeoutSec 5
            $target = @($tabs) | Where-Object { $_.url -like 'https://example.com*' } | Select-Object -First 1
            if (-not $target) { throw 'CDP endpoint responded, but the expected example.com tab was not observed.' }
            [ordered]@{
              artifact = $env:ARTIFACT_NAME
              artifact_sha256 = $env:EXPECTED_SHA256
              installed_browser = $browser
              installed_browser_sha256 = $hash
              install_dir = $env:INSTALL_DIR
              launched = $true
              observed_running = -not $proc.HasExited
              cdp_version = $cdp.Browser
              cdp_websocket = $cdp.webSocketDebuggerUrl
              observed_url = $target.url
              target_type = $target.type
            } | ConvertTo-Json | Set-Content (Join-Path $evidence 'browser-launch.json')
          } finally {
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
          }

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-work-browser-option-a-evidence
          path: ${{ runner.temp }}/windows-work-browser-evidence
          if-no-files-found: warn
