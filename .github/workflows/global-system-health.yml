name: Global System Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram:
    name: Telegram API
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Telegram diagnostics
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: ./global-automation/scripts/telegram/Get-TelegramWebhook.ps1 -BotToken $env:TELEGRAM_BOT_TOKEN
      - name: Report result
        if: success()
        shell: pwsh
        run: |
          @'
          ## 🟢 Telegram API
          **Status:** Healthy  
          **Check:** Telegram Bot API diagnostics completed successfully.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  supabase:
    name: Supabase API
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Supabase diagnostics
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./global-automation/scripts/supabase/Test-Supabase.ps1 -SupabaseUrl $env:SUPABASE_URL -ServiceRoleKey $env:SUPABASE_SERVICE_ROLE_KEY
      - name: Report result
        if: success()
        shell: pwsh
        run: |
          @'
          ## 🟢 Supabase API
          **Status:** Healthy  
          **Check:** Supabase API and authenticated database diagnostics completed successfully.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  storage:
    name: Global Storage (B2 + Drive)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install storage dependencies
        run: python -m pip install --disable-pip-version-check boto3 requests
      - name: Storage diagnostics
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: python global-automation/scripts/storage/storage_health.py
      - name: Report result
        if: success()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 🟢 Global Storage
          **Status:** Healthy  
          **Primary:** Backblaze B2 — write/read/delete verification passed.  
          **Backup:** Google Drive — OAuth and backup-folder verification passed.
          EOF

  configuration:
    name: Global Configuration
    runs-on: windows-latest
    steps:
      - name: Validate required secrets
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTHORIZED_TELEGRAM_USER_IDS: ${{ secrets.AUTHORIZED_TELEGRAM_USER_IDS }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: |
          $required = @{
            TELEGRAM_BOT_TOKEN = $env:TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET = $env:TELEGRAM_WEBHOOK_SECRET
            SUPABASE_URL = $env:SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY = $env:SUPABASE_SERVICE_ROLE_KEY
            AUTHORIZED_TELEGRAM_USER_IDS = $env:AUTHORIZED_TELEGRAM_USER_IDS
            B2_KEY_ID = $env:B2_KEY_ID
            B2_APPLICATION_KEY = $env:B2_APPLICATION_KEY
            B2_BUCKET_NAME = $env:B2_BUCKET_NAME
            GOOGLE_CLIENT_ID = $env:GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET = $env:GOOGLE_CLIENT_SECRET
            GOOGLE_REFRESH_TOKEN = $env:GOOGLE_REFRESH_TOKEN
            GOOGLE_DRIVE_BACKUP_FOLDER_ID = $env:GOOGLE_DRIVE_BACKUP_FOLDER_ID
          }
          $missing = $required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | Select-Object -ExpandProperty Key
          if ($missing) { throw "Missing required repository secret(s): $($missing -join ', ')" }
          Write-Host "All required global automation secrets are present. Secret values are not displayed."
      - name: Report result
        if: success()
        shell: pwsh
        run: |
          @'
          ## 🟢 Global Configuration
          **Status:** Healthy  
          **Check:** All required global secrets are configured. Secret values are never displayed.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  dashboard:
    name: Health Dashboard
    if: always()
    needs: [telegram, supabase, storage, configuration]
    runs-on: ubuntu-latest
    steps:
      - name: Build health dashboard
        shell: bash
        env:
          TELEGRAM_STATUS: ${{ needs.telegram.result }}
          SUPABASE_STATUS: ${{ needs.supabase.result }}
          STORAGE_STATUS: ${{ needs.storage.result }}
          CONFIG_STATUS: ${{ needs.configuration.result }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "🟢 Healthy" ;;
              *) echo "🔴 Failed" ;;
            esac
          }

          OVERALL="success"
          for S in "$TELEGRAM_STATUS" "$SUPABASE_STATUS" "$STORAGE_STATUS" "$CONFIG_STATUS"; do
            [ "$S" = "success" ] || OVERALL="failure"
          done

          if [ "$OVERALL" = "success" ]; then
            OVERALL_LABEL="🟢 ALL SYSTEMS HEALTHY"
          else
            OVERALL_LABEL="🔴 SYSTEM CHECK FAILED"
          fi

          cat > "$GITHUB_STEP_SUMMARY" <<EOF
          # 🏥 Global System Health

          ## $OVERALL_LABEL

          | Component | Status | Role |
          |---|---|---|
          | Telegram API | $(status_icon "$TELEGRAM_STATUS") | Input / transport |
          | Supabase API | $(status_icon "$SUPABASE_STATUS") | Metadata / control plane |
          | Backblaze B2 | $(status_icon "$STORAGE_STATUS") | **Primary storage** |
          | Google Drive | $(status_icon "$STORAGE_STATUS") | **Backup storage** |
          | Global Configuration | $(status_icon "$CONFIG_STATUS") | Secrets / configuration |

          ## Architecture

          \`\`\`
          Telegram → Supabase Edge Function → Backblaze B2 (PRIMARY)
                                               ↓
                                        Google Drive (BACKUP)
                                               ↓
                                      SHA-256 verification
                                               ↓
                                      Supabase metadata
                                               ↓
                                      GitHub monitoring
          \`\`\`

          ## Result

          **Telegram:** $TELEGRAM_STATUS  
          **Supabase:** $SUPABASE_STATUS  
          **Storage:** $STORAGE_STATUS  
          **Configuration:** $CONFIG_STATUS  

          > No credentials or secret values are exposed in this report.
          EOF

          if [ "$OVERALL" != "success" ]; then
            exit 1
          fi
