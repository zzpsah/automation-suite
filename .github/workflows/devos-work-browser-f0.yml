name: DEVOS Work Browser Core

on:
  pull_request:
    paths:
      - 'devos-work-browser/**'
      - '.github/workflows/devos-work-browser-f0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore devos-work-browser/Devos.WorkBrowser.sln
      - name: Build
        run: dotnet build devos-work-browser/Devos.WorkBrowser.sln -c Release --no-restore
      - name: Test
        run: dotnet test devos-work-browser/tests/Devos.WorkBrowser.Tests.csproj -c Release --no-build --verbosity normal
      - name: Publish Windows x64
        run: dotnet publish devos-work-browser/src/Devos.WorkBrowser.csproj -c Release -r win-x64 --self-contained true --no-restore -o devos-work-browser/artifacts/win-x64
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEVOS-Work-Browser-win-x64
          path: devos-work-browser/artifacts/win-x64/
          if-no-files-found: error
