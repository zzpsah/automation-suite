name: Windows Work Browser - Release

on:
  push:
    tags:
      - 'browser-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, e.g. browser-v0.6.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-work-browser-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRODUCT_ROOT: browser-automation/windows-work-browser
    steps:
      - name: Resolve release ref
        id: ref
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.release_tag }}' } else { '${{ github.ref_name }}' }
          if (-not $tag) { throw 'Release tag is required.' }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and test agent/runtime
        shell: pwsh
        working-directory: browser-automation/windows-work-browser
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
          npm run sbom

      - name: Fail closed unless readiness manifest is fully green
        shell: pwsh
        working-directory: browser-automation/windows-work-browser
        run: npm run release:preflight

      - name: Verify pinned upstream artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw "$env:PRODUCT_ROOT/upstream/OPTION-A-RELEASE.json" | ConvertFrom-Json
          if ($manifest.verification.status -ne 'VERIFIED_RUNTIME') { throw 'Upstream artifact is not runtime-verified.' }
          $stage = Join-Path $env:RUNNER_TEMP 'wwb-release'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $file = Join-Path $stage $manifest.artifact.filename
          Invoke-WebRequest -Uri $manifest.artifact.download_url -OutFile $file
          $sha = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          if ($sha -ne $manifest.artifact.sha256.ToLowerInvariant()) { throw "BrowserOS SHA-256 mismatch: $sha" }
          $sig = Get-AuthenticodeSignature -FilePath $file
          if ($sig.Status -ne 'Valid') { throw "BrowserOS Authenticode status: $($sig.Status)" }
          "BROWSEROS_INSTALLER=$file" | Out-File $env:GITHUB_ENV -Append

      - name: Assemble release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'Windows-Work-Browser'
          $root = Join-Path $bundle 'Windows-Work-Browser'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item $env:BROWSEROS_INSTALLER (Join-Path $root 'BrowserOS-Windows-x64-installer.exe')
          Copy-Item "$env:PRODUCT_ROOT/dist" (Join-Path $root 'agent-runtime') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/extension" (Join-Path $root 'extension') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/sbom.cdx.json" (Join-Path $root 'sbom.cdx.json')
          Copy-Item "$env:PRODUCT_ROOT/docs" (Join-Path $root 'docs') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/runtime" (Join-Path $root 'runtime-contracts') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/agent" (Join-Path $root 'agent-contracts') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/upstream/OPTION-A-RELEASE.json" (Join-Path $root 'OPTION-A-RELEASE.json')
          $hashes = Get-ChildItem -File -Recurse $root | ForEach-Object {
            [ordered]@{ file = $_.FullName.Substring($root.Length + 1); sha256 = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant() }
          }
          $hashes | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $root 'SHA256SUMS.json')
          $zip = Join-Path $env:RUNNER_TEMP "Windows-Work-Browser-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path $root -DestinationPath $zip -Force
          "RELEASE_BUNDLE=$zip" | Out-File $env:GITHUB_ENV -Append

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-work-browser-release-bundle
          path: ${{ env.RELEASE_BUNDLE }}
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.ref.outputs.tag }}'
          gh release create $tag $env:RELEASE_BUNDLE --title "Windows Work Browser $tag" --generate-notes
