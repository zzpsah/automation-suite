name: Telegram Auto Configure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-auto-configure.yml'
      - 'global-automation/scripts/telegram/**'
  workflow_dispatch:

jobs:
  configure:
    name: Set and verify UMVInputBot webhook
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure webhook
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_URL: https://sxfnrwugsyfypqgfglzc.supabase.co/functions/v1/telegram-input-v2
        run: |
          ./global-automation/scripts/telegram/Set-TelegramWebhook.ps1 `
            -BotToken $env:TELEGRAM_BOT_TOKEN `
            -WebhookUrl $env:WEBHOOK_URL `
            -SecretToken $env:TELEGRAM_WEBHOOK_SECRET

      - name: Verify webhook
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          ./global-automation/scripts/telegram/Get-TelegramWebhook.ps1 -BotToken $env:TELEGRAM_BOT_TOKEN
