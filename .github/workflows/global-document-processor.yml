name: Global Document Processor

on:
  workflow_dispatch:
    inputs:
      recovery_document_id:
        description: 'Optional telegram_intake UUID to process exclusively'
        required: false
        type: string
  repository_dispatch:
    types: [document-intake, document-recovery]
  workflow_run:
    workflows: ["Global Storage Worker"]
    types: [completed]
  push:
    paths:
      - 'global-automation/scripts/document/**'
      - 'global-automation/govdoc-ocr/**'
      - '.github/workflows/global-document-processor.yml'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: global-document-processor
  cancel-in-progress: false

jobs:
  process:
    name: B2 → GovDOC OCR → Supabase
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system OCR packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check boto3 requests pypdf Pillow

      - name: Migrate legacy Drive/App Script OCR records to GovDOC Vision
        id: legacy_migration
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: python global-automation/scripts/document/reprocess_legacy_govdoc.py

      - name: Process stored Telegram documents with GovDOC OCR
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          RECOVERY_DOCUMENT_ID: ${{ github.event.client_payload.document_id || github.event.inputs.recovery_document_id }}
        run: python global-automation/scripts/document/document_processor_with_govdoc.py
