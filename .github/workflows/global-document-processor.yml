name: Global Document Processor

on:
  workflow_dispatch:
    inputs:
      recovery_document_id:
        description: 'Optional telegram_intake UUID to process exclusively'
        required: false
        type: string
  repository_dispatch:
    types: [document-recovery]
  push:
    paths:
      - 'global-automation/scripts/document/**'
      - '.github/workflows/global-document-processor.yml'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: global-document-processor
  cancel-in-progress: false

jobs:
  process:
    name: B2 → OCR → Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system OCR packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check boto3 requests pypdf

      - name: Process stored Telegram documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          RECOVERY_DOCUMENT_ID: ${{ github.event.client_payload.document_id || github.event.inputs.recovery_document_id }}
        run: python global-automation/scripts/document/document_processor.py
