name: Document Intelligence Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: document-intelligence-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng poppler-utils libgl1
      - name: Install Python dependencies
        working-directory: document-intelligence
        run: pip install -r worker/requirements.txt
      - name: Run bounded processing batch
        working-directory: document-intelligence
        env:
          SUPABASE_URL: ${{ secrets.DI_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DI_SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.DI_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.DI_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.DI_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.DI_R2_BUCKET }}
          MAX_DOCUMENTS_PER_RUN: '5'
        run: python worker/worker.py
