name: Global Document Recovery Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: global-document-recovery
  cancel-in-progress: true

jobs:
  recovery:
    name: Detect stale and failed document records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run recovery diagnostics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python global-automation/scripts/document/pipeline_recovery.py
