name: Windows Work Browser - Developer Release

on:
  push:
    branches:
      - 'release/browser-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Developer release tag, e.g. browser-v0.1.0-preview.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-work-browser-developer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRODUCT_ROOT: browser-automation/windows-work-browser
      BROWSEROS_URL: https://github.com/browseros-ai/BrowserOS/releases/download/v0.50.3/BrowserOS_v0.50.3_x64_installer.exe
      BROWSEROS_SHA256: 3ae8dc6cd7fa8c39760d8c95591147e283705ec7d6f1cc4b02561d2696ef86c7
      BROWSEROS_NAME: BrowserOS_v0.50.3_x64_installer.exe
    steps:
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.release_tag }}' } else { '${{ github.ref_name }}' -replace '^release/', '' }
          if ($tag -notmatch '^browser-v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$') { throw "Invalid developer release tag: $tag" }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build/test agent and generate SBOM
        shell: pwsh
        working-directory: ${{ env.PRODUCT_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
          npm run sbom

      - name: Validate developer-preview gates
        shell: pwsh
        working-directory: ${{ env.PRODUCT_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content -Raw 'RELEASE-READINESS.json' | ConvertFrom-Json
          $required = @('contractSecurityCi','agentTypecheckBuildRuntime','windowsArtifactIntegrityInstallLaunch','browserSemanticE2E','nativeWindowsE2E','extractionE2E','filesE2E','imageE2E','workflowE2E')
          foreach ($gate in $required) {
            if ($r.gates.$gate -ne $true) { throw "Developer preview gate is not green: $gate" }
          }

      - name: Download and verify BrowserOS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'wwb-developer-release'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $file = Join-Path $stage $env:BROWSEROS_NAME
          Invoke-WebRequest -Uri $env:BROWSEROS_URL -OutFile $file
          $actual = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
          if ($actual -ne $env:BROWSEROS_SHA256) { throw "BrowserOS SHA-256 mismatch: $actual" }
          $sig = Get-AuthenticodeSignature -FilePath $file
          if ($sig.Status -ne 'Valid') { throw "BrowserOS Authenticode status: $($sig.Status)" }
          "BROWSEROS_INSTALLER=$file" | Out-File $env:GITHUB_ENV -Append

      - name: Assemble developer bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'Windows-Work-Browser-Developer-Preview'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item $env:BROWSEROS_INSTALLER (Join-Path $bundle 'BrowserOS-Windows-x64-installer.exe')
          Copy-Item "$env:PRODUCT_ROOT/dist" (Join-Path $bundle 'agent-runtime') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/extension" (Join-Path $bundle 'extension') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/runtime" (Join-Path $bundle 'runtime') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/agent" (Join-Path $bundle 'agent-contracts') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/docs" (Join-Path $bundle 'docs') -Recurse
          Copy-Item "$env:PRODUCT_ROOT/scripts/Start-Work-Browser.cmd" (Join-Path $bundle 'Start-Work-Browser.cmd')
          Copy-Item "$env:PRODUCT_ROOT/scripts/start-work-browser.ps1" (Join-Path $bundle 'start-work-browser.ps1')
          Copy-Item "$env:PRODUCT_ROOT/RELEASE-READINESS.json" (Join-Path $bundle 'RELEASE-READINESS.json')
          Copy-Item "$env:PRODUCT_ROOT/sbom.cdx.json" (Join-Path $bundle 'sbom.cdx.json')
          @"
Windows Work Browser — Developer Preview

Tag: ${{ steps.tag.outputs.tag }}
Base BrowserOS: v0.50.3 x64
BrowserOS SHA-256: $env:BROWSEROS_SHA256

This build is for testing/development and is UNSIGNED by Automation Suite.
It must not be treated as a production installer.

Start: Start-Work-Browser.cmd
"@ | Set-Content (Join-Path $bundle 'README.txt')
          $zip = Join-Path $env:RUNNER_TEMP "Windows-Work-Browser-${{ steps.tag.outputs.tag }}.zip"
          Compress-Archive -Path "$bundle\*" -DestinationPath $zip -Force
          "RELEASE_BUNDLE=$zip" | Out-File $env:GITHUB_ENV -Append

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-work-browser-developer-preview
          path: ${{ env.RELEASE_BUNDLE }}
          if-no-files-found: error

      - name: Publish GitHub developer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.tag.outputs.tag }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:RELEASE_BUNDLE --clobber
          } else {
            gh release create $tag $env:RELEASE_BUNDLE --title "Windows Work Browser $tag" --prerelease --generate-notes
          }
