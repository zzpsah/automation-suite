name: Global Document Publication

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Global Document Processor"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: global-document-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish eligible documents
    # A scheduled/manual run always executes. A workflow_run event executes only
    # when the OCR processor completed successfully.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Publish safe completed documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python global-automation/scripts/document/publication_worker.py
