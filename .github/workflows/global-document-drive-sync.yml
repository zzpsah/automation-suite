name: Global Document Drive Filename Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths:
      - global-automation/scripts/document/drive_filename_sync.py
      - .github/workflows/global-document-drive-sync.yml

concurrency:
  group: global-document-drive-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Supabase → Google Drive filenames
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Synchronize Drive filenames
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python global-automation/scripts/document/drive_filename_sync.py
