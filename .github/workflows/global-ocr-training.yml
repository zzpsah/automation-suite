name: Global OCR Training

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: Reviewed JSONL corpus path
        required: true
        default: global-automation/ocr/tests/training_corpus.jsonl
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

jobs:
  train:
    name: Build reviewable OCR improvement candidates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run training pipeline
        env:
          PYTHONPATH: global-automation
        run: |
          python -m ocr.training.train_pipeline \
            "${{ inputs.corpus || 'global-automation/ocr/tests/training_corpus.jsonl' }}" \
            --output-dir training_artifacts

      - name: Run OCR and training regression tests
        env:
          PYTHONPATH: global-automation
        run: python -m pytest global-automation/ocr/tests global-automation/ocr/training/tests -q

      - name: Upload reviewable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: global-ocr-training-artifacts
          path: training_artifacts/
          if-no-files-found: error
