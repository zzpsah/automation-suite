name: Google Drive Storage Health

on:
  workflow_dispatch:

jobs:
  google-drive:
    name: Google Drive OAuth
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GOOGLE_DRIVE_BACKUP_FOLDER_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secret(s): ${missing[*]}"
            exit 1
          fi
          echo "All four Google Drive configuration secrets are present. Values are not displayed."

      - name: Exchange refresh token for access token
        id: token
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${GOOGLE_CLIENT_ID}" \
            --data-urlencode "client_secret=${GOOGLE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
            --data-urlencode 'grant_type=refresh_token')
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("access_token"), "No access token returned"; print("OAuth token exchange: OK")' <<< "$response"

      - name: Verify Drive API access and backup folder
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_BACKUP_FOLDER_ID }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${GOOGLE_CLIENT_ID}" \
            --data-urlencode "client_secret=${GOOGLE_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
            --data-urlencode 'grant_type=refresh_token')
          access_token=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$response")
          folder=$(curl -fsS \
            -H "Authorization: Bearer ${access_token}" \
            "https://www.googleapis.com/drive/v3/files/${GOOGLE_DRIVE_BACKUP_FOLDER_ID}?fields=id,name,mimeType,trashed")
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("id"), "Folder lookup failed"; assert d.get("mimeType")=="application/vnd.google-apps.folder", "Configured ID is not a Drive folder"; assert not d.get("trashed",False), "Configured backup folder is trashed"; print("Google Drive API access: OK"); print("Backup folder lookup: OK")' <<< "$folder"
