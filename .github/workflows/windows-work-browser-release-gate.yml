name: Windows Work Browser - Final Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release readiness
        shell: bash
        run: |
          set -euo pipefail
          file='browser-automation/windows-work-browser/RELEASE-READINESS.json'
          test -f "$file"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('browser-automation/windows-work-browser/RELEASE-READINESS.json')
          data = json.loads(p.read_text())
          if data.get('releaseReady') is not True:
              raise SystemExit('RELEASE BLOCKED: releaseReady is not true.')
          gates = data.get('gates', {})
          failed = [k for k, v in gates.items() if v is not True]
          if failed:
              raise SystemExit('RELEASE BLOCKED: incomplete gates: ' + ', '.join(failed))
          print('All mandatory release gates are true.')
          PY
      - name: Final gate record
        shell: bash
        run: |
          set -euo pipefail
          echo 'No publish/tag action is performed by this workflow.'
          echo 'A release can only be promoted after an authorized maintainer reviews the complete evidence bundle.'
