name: Backblaze B2 Storage Health

on:
  workflow_dispatch:

env:
  # B2 S3 endpoint is public configuration, not a secret.
  B2_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com

jobs:
  b2:
    name: Backblaze B2
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          missing=()
          for name in B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secret(s): ${missing[*]}"
            exit 1
          fi
          echo "B2 credentials and bucket configuration are present. Secret values are not displayed."
          echo "Using canonical B2 S3 endpoint: ${B2_S3_ENDPOINT}"

      - name: Install AWS CLI
        run: python -m pip install --upgrade awscli

      - name: Verify B2 S3 authentication and bucket access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          echo "Checking bucket access..."
          aws --endpoint-url "$B2_S3_ENDPOINT" s3api head-bucket --bucket "$B2_BUCKET_NAME"
          echo "B2 S3 authentication: OK"
          echo "Bucket access: OK"

      - name: Verify write and delete permission with temporary object
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          key="_health-check/github-actions-${GITHUB_RUN_ID}.txt"
          printf 'UMV B2 health check %s\n' "$GITHUB_RUN_ID" > /tmp/b2-health.txt
          cleanup() {
            aws --endpoint-url "$B2_S3_ENDPOINT" s3 rm "s3://${B2_BUCKET_NAME}/${key}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          aws --endpoint-url "$B2_S3_ENDPOINT" s3 cp /tmp/b2-health.txt "s3://${B2_BUCKET_NAME}/${key}"
          aws --endpoint-url "$B2_S3_ENDPOINT" s3api head-object --bucket "$B2_BUCKET_NAME" --key "$key"
          echo "B2 write: OK"
          echo "B2 read/head: OK"
          aws --endpoint-url "$B2_S3_ENDPOINT" s3 rm "s3://${B2_BUCKET_NAME}/${key}"
          trap - EXIT
          echo "B2 delete: OK"
          echo "Backblaze B2 storage health: GREEN"
