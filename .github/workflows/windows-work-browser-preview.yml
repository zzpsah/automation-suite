name: Windows Work Browser - Developer Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'browser-automation/windows-work-browser/**'
      - '.github/workflows/windows-work-browser-preview.yml'

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_URL: https://github.com/browseros-ai/BrowserOS/releases/download/v0.50.3/BrowserOS_v0.50.3_x64_installer.exe
      EXPECTED_SHA256: 3ae8dc6cd7fa8c39760d8c95591147e283705ec7d6f1cc4b02561d2696ef86c7
      ARTIFACT_NAME: BrowserOS_v0.50.3_x64_installer.exe
      PRODUCT_ROOT: browser-automation/windows-work-browser
    steps:
      - uses: actions/checkout@v4

      - name: Install agent dependencies
        working-directory: ${{ env.PRODUCT_ROOT }}
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build and test agent
        working-directory: ${{ env.PRODUCT_ROOT }}
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run sbom

      - name: Download and verify BrowserOS
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wwb-preview"
          mkdir -p "$root"
          curl -fsSL "$ARTIFACT_URL" -o "$root/$ARTIFACT_NAME"
          actual="$(sha256sum "$root/$ARTIFACT_NAME" | awk '{print tolower($1)}')"
          test "$actual" = "$(echo "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')"
          printf '%s\n' "Verified BrowserOS SHA-256: $actual"

      - name: Assemble preview bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/windows-work-browser-preview-bundle"
          mkdir -p "$bundle"
          cp "$RUNNER_TEMP/wwb-preview/$ARTIFACT_NAME" "$bundle/"
          cp -R "$PRODUCT_ROOT/extension" "$bundle/extension"
          cp -R "$PRODUCT_ROOT/dist" "$bundle/agent-dist"
          cp "$PRODUCT_ROOT/scripts/run-work-browser-test.ps1" "$bundle/"
          cp "$PRODUCT_ROOT/scripts/start-work-browser.ps1" "$bundle/"
          cp "$PRODUCT_ROOT/scripts/Start-Work-Browser.cmd" "$bundle/"
          cp "$PRODUCT_ROOT/RELEASE-READINESS.json" "$bundle/"
          cp "$PRODUCT_ROOT/docs/TEST-MODE.md" "$bundle/"
          cp "$PRODUCT_ROOT/docs/FINAL-RELEASE-PACKAGE.md" "$bundle/"
          cp "$PRODUCT_ROOT/sbom.cdx.json" "$bundle/"
          cat > "$bundle/PREVIEW-README.txt" <<EOF
Windows Work Browser Developer Preview

Base: BrowserOS v0.50.3 x64
SHA-256: $EXPECTED_SHA256

This preview is not a signed production release.
Install the pinned BrowserOS artifact on Windows, then run Start-Work-Browser.cmd.
EOF
          (cd "$bundle" && zip -qr "$RUNNER_TEMP/WindowsWorkBrowser-DeveloperPreview.zip" .)

      - name: Upload developer preview
        uses: actions/upload-artifact@v4
        with:
          name: WindowsWorkBrowser-DeveloperPreview
          path: ${{ runner.temp }}/WindowsWorkBrowser-DeveloperPreview.zip
          if-no-files-found: error
