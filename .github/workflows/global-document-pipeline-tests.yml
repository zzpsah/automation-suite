name: Global Document Pipeline Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'global-automation/scripts/document/**'
      - 'global-automation/govdoc-ocr/**'
      - '.github/workflows/global-document-pipeline-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Offline document pipeline checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf boto3
      - name: Compile document and GovDOC OCR scripts
        run: |
          python -m compileall -q global-automation/scripts/document
          python -m compileall -q global-automation/govdoc-ocr
      - name: Run GovDOC OCR smoke test
        working-directory: global-automation/govdoc-ocr
        run: python smoke_test.py
      - name: Run offline pipeline smoke test
        run: python global-automation/scripts/document/pipeline_smoke_test.py
