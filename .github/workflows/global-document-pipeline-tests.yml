name: Global Document Pipeline Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'global-automation/scripts/document/**'
      - 'global-automation/govdoc-ocr/**'
      - '.github/workflows/global-document-pipeline-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Offline document pipeline checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install system OCR and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng fonts-noto-core
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest Pillow requests pypdf boto3
      - name: Run deterministic pipeline verification loop
        run: python global-automation/scripts/document/verify_pipeline.py
