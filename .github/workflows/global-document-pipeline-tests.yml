name: Global Document Pipeline Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'global-automation/scripts/document/**'
      - 'global-automation/govdoc-ocr/**'
      - 'global-automation/govdoc_ocr/**'
      - '.github/workflows/global-document-pipeline-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Offline document pipeline checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install system OCR and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng fonts-noto-core
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest Pillow requests pypdf boto3
      - name: Verify supported package imports
        run: |
          PYTHONPATH=global-automation:global-automation/govdoc-ocr python - <<'PY'
          import govdoc_ocr
          from govdoc_ocr import process_document, process_image, process_pdf, process_pdf_bytes
          print("govdoc_ocr import contract: PASS")
          print("exports:", all(callable(x) for x in (process_document, process_image, process_pdf, process_pdf_bytes)))
          PY
      - name: Run GovDOC OCR unit suite
        run: PYTHONPATH=global-automation:global-automation/govdoc-ocr python -m pytest -q global-automation/govdoc-ocr/tests
      - name: Run deterministic pipeline verification loop
        run: python global-automation/scripts/document/verify_pipeline.py
