name: Build Phone Printer

on:
  push:
    paths:
      - 'phone-printer/**'
      - '.github/workflows/build-phone-printer.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-printer/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhonePrinter-APK
          path: phone-printer/android-app/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: phone-printer/windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build Windows GUI EXE
        run: pyinstaller --noconfirm --onefile --noconsole --name PhonePrinterBridge admin_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhonePrinter-Windows
          path: phone-printer/windows-app/dist/PhonePrinterBridge.exe
