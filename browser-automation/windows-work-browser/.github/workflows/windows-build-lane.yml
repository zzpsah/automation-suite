name: Windows Work Browser Build Lane

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "A=integration, B=full Chromium source build"
        required: true
        default: "A"
        type: choice
        options:
          - A
          - B

jobs:
  build:
    # Requires a dedicated Windows runner with the documented toolchain.
    # Never silently falls back to a hosted runner: the full Chromium build
    # needs substantial disk, RAM and build tooling.
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout product
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Windows prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Windows runner required' }
          git --version
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) { throw 'git missing' }
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) { throw 'Python missing' }
          $free = (Get-PSDrive -Name (Get-Location).Drive.Name).Free / 1GB
          Write-Host ("Free disk: {0:N1} GB" -f $free)
          if ('${{ inputs.lane }}' -eq 'B' -and $free -lt 90) { throw 'Full Chromium lane requires roughly 100GB free disk.' }

      - name: Bootstrap pinned sources
        run: .\browser-automation\windows-work-browser\upstream\bootstrap-windows.ps1 -Root "$env:RUNNER_TEMP\wwb-upstream"

      - name: Inspect source manifest
        run: Get-Content "$env:RUNNER_TEMP\wwb-upstream\SOURCE-MANIFEST.json"

      - name: Fast integration lane gate
        if: ${{ inputs.lane == 'A' }}
        run: |
          Write-Host 'Lane A selected: upstream acquisition/provenance gate passed.'
          Write-Host 'Attach an approved compatible Windows BrowserOS artifact here before packaging.'

      - name: Full Chromium build lane
        if: ${{ inputs.lane == 'B' }}
        run: |
          $browseros = "$env:RUNNER_TEMP\wwb-upstream\BrowserOS"
          $chromium = "$env:RUNNER_TEMP\chromium\src"
          if (-not (Test-Path $chromium)) { throw 'Chromium source checkout missing. Provision depot_tools + Chromium source on the runner.' }
          Set-Location "$browseros\packages\browseros"
          uv sync
          uv run browseros build --preset release --product browseros --chromium-src $chromium

      - name: Publish build evidence
        if: always()
        run: |
          $out = "$env:GITHUB_WORKSPACE\browser-automation\windows-work-browser\build-evidence"
          New-Item -ItemType Directory -Force $out | Out-Null
          if (Test-Path "$env:RUNNER_TEMP\wwb-upstream\SOURCE-MANIFEST.json") {
            Copy-Item "$env:RUNNER_TEMP\wwb-upstream\SOURCE-MANIFEST.json" $out -Force
          }
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber | ConvertTo-Json | Set-Content "$out\host.json"
