name: Windows Work Browser Agent Package CI

on:
  push:
    paths:
      - 'browser-automation/windows-work-browser/agent/**'
      - 'browser-automation/windows-work-browser/runtime/**'
      - 'browser-automation/windows-work-browser/package.json'
      - 'browser-automation/windows-work-browser/tsconfig.json'
      - '.github/workflows/agent-package-ci.yml'
  pull_request:
    paths:
      - 'browser-automation/windows-work-browser/agent/**'
      - 'browser-automation/windows-work-browser/runtime/**'
      - 'browser-automation/windows-work-browser/package.json'
      - 'browser-automation/windows-work-browser/tsconfig.json'
      - '.github/workflows/agent-package-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-automation/windows-work-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser-automation/windows-work-browser/package-lock.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
