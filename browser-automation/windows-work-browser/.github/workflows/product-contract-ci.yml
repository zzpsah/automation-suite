name: Windows Work Browser Product Contract

on:
  push:
    paths:
      - 'browser-automation/windows-work-browser/**'
  pull_request:
    paths:
      - 'browser-automation/windows-work-browser/**'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required product files
        shell: bash
        run: |
          set -euo pipefail
          root='browser-automation/windows-work-browser'
          for f in README.md BUILD-STATUS.md docs/BUILD-PLAN.md upstream/BROWSEROS-PIN.md upstream/REUSE-MATRIX.md upstream/bootstrap-windows.ps1 upstream/BUILD-GATE.md agent/action-contract.ts agent/policy-engine.ts agent/evidence-schema.ts; do
            test -f "$root/$f"
          done
      - name: Reject direct arbitrary execution from agent layer
        shell: bash
        run: |
          set -euo pipefail
          root='browser-automation/windows-work-browser/agent'
          if grep -RniE 'child_process|exec\(|execFile\(|spawn\(|powershell\s+-command|Invoke-Expression' "$root"; then
            echo 'Potential direct arbitrary execution found in agent layer.'
            exit 1
          fi
      - name: Validate immutable upstream pins
        shell: bash
        run: |
          set -euo pipefail
          grep -q '8f5d36bc16f57115aeeff34baf4ad6aa964d509c' browser-automation/windows-work-browser/upstream/BROWSEROS-PIN.md
          grep -q '7765002ac88040aedc781be89afe68475a9d6c88' browser-automation/windows-work-browser/upstream/BROWSEROS-PIN.md
